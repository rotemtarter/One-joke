# Applies supabase/migrations to the PRODUCTION database (ARCHITECTURE 9.3, ADR-5).
# Manual only: Actions -> "Migrate production database" -> Run workflow, type "production".
# Secrets (set by the owner in GitHub): SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD.
name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to apply the migrations to the production database'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'production' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the "supabase" version in package.json.
          version: 2.121.0

      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        run: supabase db push
